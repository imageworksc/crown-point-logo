<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crown Point Logo Proposal</title>
<link rel="icon" href="option-1-badge/svg/crown-point-option-1-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap">
<style>
:root {
  --ink: #0B0B0B; --orange: #FD673D; --muted: #7A7672;
  /* Shared logo unit: both options use the same scale, so CROWN POINT is the same size in each. */
  --u: min(0.52px, calc((100vw - 48px) / 1264.1));
}
* { box-sizing: border-box; }
body { margin: 0; background: #fff; color: var(--ink); font: 16px/1.5 "Archivo", "Helvetica Neue", Arial, sans-serif; }
.intro { padding: 72px 24px 64px; text-align: center; }
.eyebrow { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--orange); font-weight: 600; margin: 0 0 10px; }
h1 { font-size: clamp(26px, 4vw, 38px); line-height: 1.15; margin: 0; font-weight: 600; }
.option + .option { margin-top: 96px; }
.option-label { text-align: center; padding: 0 24px 28px; }
.option-label h2 { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; margin: 0; }
.space { display: grid; place-items: center; min-height: clamp(260px, 52vh, 480px); padding: 64px 24px; }
.space.light { background: #fff; border-top: 1px solid #E6E2DD; }
.space.dark { background: var(--ink); }
.space img { display: block; height: auto; max-width: 100%; }
.o1 { width: calc(var(--u) * 1264.1); }
.o2 { width: calc(var(--u) * 1213.4); }
footer { padding: 48px 24px 56px; text-align: center; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header class="intro">
  <p class="eyebrow">Crown Point Construction</p>
  <h1>Logo proposal</h1>
</header>

<section class="option">
  <div class="option-label"><h2>Option 1</h2></div>
  <div class="space light"><img class="o1" src="option-1-badge/svg/crown-point-option-1-light.svg" alt="Option 1 on a light background"></div>
  <div class="space dark"><img class="o1" src="option-1-badge/svg/crown-point-option-1-dark.svg" alt="Option 1 on a dark background"></div>
</section>

<section class="option">
  <div class="option-label"><h2>Option 2</h2></div>
  <div class="space light"><img class="o2" src="option-2-crown/svg/crown-point-option-2-light.svg" alt="Option 2 on a light background"></div>
  <div class="space dark"><img class="o2" src="option-2-crown/svg/crown-point-option-2-dark.svg" alt="Option 2 on a dark background"></div>
</section>

<footer>Prepared by ImageWorks Creative</footer>
</body>
</html>
