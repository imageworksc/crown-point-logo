<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crown Point Logo Proposal</title>
<link rel="icon" href="option-1-badge/svg/crown-point-option-1-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap">
<style>
:root {
  --ink: #0B0B0B; --orange: #FD673D;
  --bg: #FFFFFF; --fg: #0B0B0B; --muted: #7A7672; --line: #E6E2DD; --surface: #F5F4F2;
  /* Shared logo unit: both options use the same scale, so CROWN POINT is the same size in each. */
  --u: min(0.7px, calc((100vw - 64px) / 1071.8));
  --hu: 0.17px;
}
:root[data-theme="dark"] {
  --bg: #0B0B0B; --fg: #FFFFFF; --muted: #8E8984; --line: #2A2826; --surface: #161514;
}
* { box-sizing: border-box; }
html { scroll-snap-type: y mandatory; scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 "Archivo", "Helvetica Neue", Arial, sans-serif; transition: background .3s, color .3s; }

/* Logo files per theme */
[data-theme="light"] .on-dark, [data-theme="dark"] .on-light { display: none; }

/* Screens */
.screen { position: relative; height: 100vh; height: 100svh; scroll-snap-align: start; display: grid; place-items: center; padding: 72px 64px; }
.label { position: absolute; top: 28px; left: 32px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.label b { color: var(--fg); font-weight: 600; }
.screen img { display: block; height: auto; max-width: 100%; }
.o1 { width: calc(var(--u) * 1071.8); }
.o2 { width: calc(var(--u) * 1022.9); }
.icon { width: clamp(200px, 46vmin, 440px); }
.hint { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* Website header mock */
.browser { width: min(1040px, 100%); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); box-shadow: 0 20px 60px rgba(0,0,0,.08); }
.browser-bar { display: flex; align-items: center; gap: 6px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.browser-bar i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.browser-bar span { flex: 1; margin-left: 10px; height: 22px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); }
.nav { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 22px clamp(16px, 3vw, 36px); background: var(--bg); border-bottom: 1px solid var(--line); }
.nav img.h1 { height: calc(var(--hu) * 266.1); width: auto; max-width: none; }
.nav img.h2 { height: calc(var(--hu) * 260.3); width: auto; max-width: none; }
.nav ul { display: flex; gap: 28px; list-style: none; margin: 0; padding: 0; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; font-weight: 500; }
.nav .cta { background: var(--orange); color: var(--ink); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 12px 16px; white-space: nowrap; }
.hero { height: clamp(140px, 28vh, 300px); background: linear-gradient(180deg, var(--surface), var(--bg)); }

/* Toggle */
.toggle { position: fixed; top: 20px; right: 24px; z-index: 10; display: flex; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
.toggle button { font: 500 12px/1 "Archivo", sans-serif; letter-spacing: .08em; text-transform: uppercase; border: 0; background: none; color: var(--muted); padding: 8px 14px; border-radius: 999px; cursor: pointer; }
.toggle button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

/* Navigation dots (right) */
.dots { position: fixed; right: 24px; top: 50%; transform: translateY(-50%); z-index: 10; display: flex; flex-direction: column; gap: 14px; }
.dots a { display: block; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--muted); }
.dots a.active { background: var(--orange); border-color: var(--orange); }
.dots .sep { height: 10px; }

@media (max-width: 760px) {
  .screen { padding: 72px 36px 72px 24px; }
  .label { left: 20px; }
  .toggle { right: 16px; top: 16px; }
  .dots { right: 12px; }
  .nav ul { display: none; }
  .nav .cta { display: none; }
  :root { --hu: 0.13px; }
}
</style>
</head>
<body>
<div class="toggle" role="group" aria-label="Background">
  <button type="button" data-set="light" aria-pressed="true">Light</button>
  <button type="button" data-set="dark" aria-pressed="false">Dark</button>
</div>

<nav class="dots" aria-label="Sections">
  <a href="#o1-logo" aria-label="Option 1 · Logo"></a>
  <a href="#o1-icon" aria-label="Option 1 · Icon"></a>
  <a href="#o1-header" aria-label="Option 1 · Website header"></a>
  <span class="sep"></span>
  <a href="#o2-logo" aria-label="Option 2 · Logo"></a>
  <a href="#o2-icon" aria-label="Option 2 · Icon"></a>
  <a href="#o2-header" aria-label="Option 2 · Website header"></a>
</nav>

<main>
  <section class="screen" id="o1-logo">
    <p class="label"><b>Option 1</b> · Logo</p>
    <img class="o1 on-light" src="option-1-badge/svg/crown-point-option-1-light.svg" alt="Option 1 logo">
    <img class="o1 on-dark" src="option-1-badge/svg/crown-point-option-1-dark.svg" alt="Option 1 logo">
    <p class="hint">Scroll</p>
  </section>

  <section class="screen" id="o1-icon">
    <p class="label"><b>Option 1</b> · Icon</p>
    <img class="icon" src="option-1-badge/svg/crown-point-option-1-icon.svg" alt="Option 1 icon">
  </section>

  <section class="screen" id="o1-header">
    <p class="label"><b>Option 1</b> · Website header</p>
    <div class="browser">
      <div class="browser-bar"><i></i><i></i><i></i><span></span></div>
      <div class="nav">
        <img class="h1 on-light" src="option-1-badge/svg/crown-point-option-1-light.svg" alt="Option 1 in a website header">
        <img class="h1 on-dark" src="option-1-badge/svg/crown-point-option-1-dark.svg" alt="Option 1 in a website header">
        <ul><li>Home</li><li>Services</li><li>Projects</li><li>About</li></ul>
        <span class="cta">Get a quote</span>
      </div>
      <div class="hero"></div>
    </div>
  </section>

  <section class="screen" id="o2-logo">
    <p class="label"><b>Option 2</b> · Logo</p>
    <img class="o2 on-light" src="option-2-crown/svg/crown-point-option-2-light.svg" alt="Option 2 logo">
    <img class="o2 on-dark" src="option-2-crown/svg/crown-point-option-2-dark.svg" alt="Option 2 logo">
  </section>

  <section class="screen" id="o2-icon">
    <p class="label"><b>Option 2</b> · Icon</p>
    <img class="icon" src="option-2-crown/svg/crown-point-option-2-icon.svg" alt="Option 2 icon">
  </section>

  <section class="screen" id="o2-header">
    <p class="label"><b>Option 2</b> · Website header</p>
    <div class="browser">
      <div class="browser-bar"><i></i><i></i><i></i><span></span></div>
      <div class="nav">
        <img class="h2 on-light" src="option-2-crown/svg/crown-point-option-2-light.svg" alt="Option 2 in a website header">
        <img class="h2 on-dark" src="option-2-crown/svg/crown-point-option-2-dark.svg" alt="Option 2 in a website header">
        <ul><li>Home</li><li>Services</li><li>Projects</li><li>About</li></ul>
        <span class="cta">Get a quote</span>
      </div>
      <div class="hero"></div>
    </div>
  </section>
</main>

<script>
(function () {
  var root = document.documentElement;
  var buttons = document.querySelectorAll(".toggle button");
  function setTheme(t) {
    root.setAttribute("data-theme", t);
    buttons.forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.set === t)); });
  }
  buttons.forEach(function (b) { b.addEventListener("click", function () { setTheme(b.dataset.set); }); });
  var params = new URLSearchParams(location.search);
  if (params.get("theme") === "dark") setTheme("dark");

  var dots = {};
  document.querySelectorAll(".dots a").forEach(function (a) { dots[a.getAttribute("href").slice(1)] = a; });
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      Object.keys(dots).forEach(function (id) { dots[id].classList.toggle("active", id === e.target.id); });
    });
  }, { threshold: 0.6 });
  document.querySelectorAll(".screen").forEach(function (s) { io.observe(s); });
})();
</script>
</body>
</html>
